<form class="task-form" (submit)="submit(taskInput, $event)">
  <div class="input-row">
    <input
      class="task-input"
      type="text"
      #taskInput
      placeholder="Brain dump..."
      autocomplete="off"
      autocorrect="on"
      autocapitalize="sentences"
      (input)="onInput(taskInput)"
    />
    @if (hasValue) {
      <button class="clear-btn" type="button" (click)="clear(taskInput)" aria-label="Clear">
        <svg xmlns="http://www.w3.org/2000/svg" height="12" viewBox="0 -960 960 960" width="12" fill="currentColor">
          <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
        </svg>
      </button>
    }
    <button class="add-btn" type="submit" aria-label="Add task">
      <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
        <path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/>
      </svg>
    </button>
  </div>
</form>
