<div class="pill-group">
  @for (item of displayTasks(); track item.task.title; let i = $index) {
    <div class="pill-wrap" appSwipeDelete #swipe="appSwipeDelete">
      <div class="pill" (click)="swipe.isOpen ? swipe.close() : taskEdit.emit(i)">
        @if (item.task.category) {
          <span class="dot" [style.background]="categoryColors[item.task.category]"></span>
        }
        <span class="title">{{ item.task.title }}</span>
        @if (item.formattedDate) {
          <span class="date-tag">{{ item.formattedDate }}</span>
        }
      </div>
      <button class="delete-zone" type="button" (click)="taskRemoved.emit(i)" aria-label="Delete task">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
          <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
        </svg>
      </button>
    </div>
  }
</div>
