@if (groups().length === 0) {
  <p class="empty">Nothing here yet.</p>
} @else {
  @for (group of groups(); track group.category) {
    <div class="section">
      <div class="section-header">
        <span class="section-dot" [style.background]="group.color"></span>
        <span class="section-label" [style.color]="group.color">{{ group.label }}</span>
        <span class="section-count">{{ group.tasks.length }}</span>
      </div>

      <div class="task-list">
        @for (item of group.tasks; track item.task.title) {
          <div class="task-row">
            <span class="task-title">{{ item.task.title }}</span>
            @if (item.formattedDate) {
              <span class="task-date">{{ item.formattedDate }}</span>
            }
          </div>
        }
      </div>
    </div>
  }
}
