<div class="shell">
  <div class="top-bar">
    <button class="view-btn" (click)="toggleView()" [class.active]="viewMode() === 'summary'" aria-label="Toggle view">
      @if (viewMode() === 'list') {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      }
    </button>
  </div>

  <div class="scroll-area">
    @if (viewMode() === 'list') {
      <app-task-list
        [tasks]="facade.tasks()"
        (taskRemoved)="facade.removeTask($event)"
        (taskEdit)="editTask($event)"
      />
    } @else {
      <app-task-summary [tasks]="facade.tasks()" />
    }
  </div>

  <button class="fab" (click)="sheetService.open()" aria-label="Add task">+</button>
</div>
